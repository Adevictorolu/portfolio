name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Sync Pinterest, Test & Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Latest Pinterest Uploads (@adevictorolu)
        run: |
          python3 scripts/sync_pinterest.py
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$(git status --porcelain assets/portfolio/pinterest assets/data/pinterest_pins.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/portfolio/pinterest assets/data/pinterest_pins.json
            git commit -m "chore: auto-sync new Pinterest uploads (@adevictorolu) [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Source
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Flutter Web Release for GitHub Pages
        run: |
          flutter build web --release --base-href "/portfolio/"
          cp build/web/index.html build/web/404.html

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

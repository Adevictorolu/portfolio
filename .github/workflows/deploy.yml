name: Build & Deploy Flutter Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Sync Pinterest, Test & Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Latest Pinterest Uploads (@adevictorolu)
        run: |
          python3 scripts/sync_pinterest.py
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$(git status --porcelain assets/portfolio/pinterest assets/data/pinterest_pins.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/portfolio/pinterest assets/data/pinterest_pins.json
            git commit -m "chore: auto-sync new Pinterest uploads (@adevictorolu) [skip ci]"
            git push origin HEAD:main || true
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Source
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # Build 1: Root domain build (base-href "/") for custom domains / cPanel (avomedia.com.ng)
      - name: Build Web Bundle for cPanel / Custom Domain (avomedia.com.ng)
        run: |
          flutter build web --release --base-href "/"
          cp web/.htaccess build/web/.htaccess || true
          cp web/robots.txt build/web/robots.txt || true
          cp web/sitemap.xml build/web/sitemap.xml || true
          mkdir -p cpanel_bundle
          cp -r build/web/* cpanel_bundle/
          cp -r build/web/.htaccess cpanel_bundle/.htaccess 2>/dev/null || true
          cd cpanel_bundle && zip -r ../avomedia_cpanel_bundle.zip . && cd ..

      - name: Upload cPanel ZIP Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: avomedia_cpanel_bundle
          path: avomedia_cpanel_bundle.zip
          retention-days: 30

      # Build 2: Subpath build (base-href "/portfolio/") for GitHub Pages preview
      - name: Build Flutter Web Release for GitHub Pages
        run: |
          flutter build web --release --base-href "/portfolio/"
          cp build/web/index.html build/web/404.html
          cp web/robots.txt build/web/robots.txt || true
          cp web/sitemap.xml build/web/sitemap.xml || true

      - name: Upload GitHub Pages Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
